<body class="appear-animate">
    <div id="root"><!--app-html--></div>

    <!-- App (React hydration) -->

    <!-- Feature detection (must run before all.js) -->
    <script type="text/javascript">
        let passiveSupported = false;
        try {
            const options = {
                get passive() {
                    passiveSupported = true;
                    return false;
                },
            };
            window.addEventListener("test", null, options);
            window.removeEventListener("test", null, options);
        } catch (err) {
            passiveSupported = false;
        }

        let mobileTest;
        if (/Android|webOS|iPhone|iPad|iPod|BlackBerry/i.test(navigator.userAgent)) {
            mobileTest = true;
            document.documentElement.classList.add("mobile");
        } else {
            mobileTest = false;
            document.documentElement.classList.add("no-mobile");
        }
    </script>

    <!--
      The jQuery vendor stack (jQuery, OwlCarousel, Isotope, Magnific-Popup,

      against an empty #root before React commits the client render.

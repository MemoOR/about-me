<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="{{_('Guillermo Ortega Romo — Senior Cloud Engineer & Full Stack Developer. AWS, Azure, GCP, OCI. Python, Terraform, Bicep. Portfolio, resume & contact.')}}">
    <meta name="author" content="Guillermo Ortega Romo">

    <!-- Canonical & hreflang -->
    <link rel="canonical" href="{{ canonical_url }}">
    <link rel="alternate" hreflang="en" href="{{ alt_en_url }}">
    <link rel="alternate" hreflang="es" href="{{ alt_es_url }}">
    <link rel="alternate" hreflang="x-default" href="{{ alt_en_url }}">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Guillermo Ortega Romo — Senior Cloud Engineer">
    <meta property="og:description" content="{{_('Full Stack Engineer & Senior Cloud Engineer. AWS, Azure, GCP, OCI. Python, Terraform, Bicep. Portfolio & Resume.')}}">
    <meta property="og:url" content="{{ canonical_url }}">
    <meta property="og:image" content="{{ og_image_url }}">
    <meta property="og:locale" content="{{ 'en_US' if lang_code == 'en' else 'es_MX' }}">
    <meta property="og:locale:alternate" content="{{ 'es_MX' if lang_code == 'en' else 'en_US' }}">
    <meta property="og:site_name" content="Guillermo Ortega Romo">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Guillermo Ortega Romo — Senior Cloud Engineer">
    <meta name="twitter:description" content="{{_('Full Stack Engineer & Senior Cloud Engineer. AWS, Azure, GCP, OCI. Python, Terraform, Bicep. Portfolio & Resume.')}}">
    <meta name="twitter:image" content="{{ og_image_url }}">

    <script>
        const theme = localStorage.getItem('theme') || 'dark';
        document.documentElement.dataset.appliedTheme = theme;
    </script>

    <link rel="apple-touch-icon" sizes="180x180"
        href="{{url_for('static', filename= 'assets/web_manifest/apple-touch-icon.png')}}">
    <link rel="icon" type="image/png" sizes="32x32"
        href="{{url_for('static', filename= 'assets/web_manifest/favicon-32x32.png')}}">
    <link rel="icon" type="image/png" sizes="16x16"
        href="{{url_for('static', filename= 'assets/web_manifest/favicon-16x16.png')}}">
    <link rel="manifest" href="{{url_for('static', filename= 'assets/web_manifest/site.webmanifest')}}">
    <link rel="mask-icon" href="{{url_for('static', filename= 'assets/web_manifest/safari-pinned-tab.svg')}}"
        color="#5bbad5">
    <link rel="shortcut icon" href="{{url_for('static', filename= 'assets/web_manifest/favicon.ico')}}">

    <meta name="msapplication-TileColor" content="#da532c">
    <meta name="msapplication-config"
        content="{{url_for('static', filename= 'assets/web_manifest/browserconfig.xml')}}">
    <meta name="theme-color" content="#01758D">

    <!-- Preconnect hints -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="dns-prefetch" href="https://unpkg.com">

    <!-- normal styles that appear below the fold -->
    <link rel="preload" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.1/dist/css/bootstrap.min.css" as="style"
        onload="this.onload=null;this.rel='stylesheet'">
    <noscript>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.1/dist/css/bootstrap.min.css">
    </noscript>

    <link rel="stylesheet" href="{{url_for('static', filename= 'css/style.css')}}" type="text/css" />
    <link rel="stylesheet" href="{{url_for('static', filename= 'css/style-responsive.css')}}" type="text/css" />
    <link rel="stylesheet" href="{{url_for('static', filename= 'css/vertical-rhythm.min.css')}}" type="text/css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/magnific-popup.js/1.1.0/magnific-popup.min.css"
        type="text/css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.carousel.min.css"
        type="text/css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
        type="text/css" />
    <link rel="stylesheet" href="https://unpkg.com/splitting/dist/splitting.css" type="text/css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" type="text/css" />
    <link rel="stylesheet" href="{{url_for('static', filename= 'css/threejsapp_styles.css')}}" type="text/css" />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Guillermo Ortega Romo",
        "jobTitle": "Senior Cloud Engineer",
        "url": "https://guillermoortega.me",
        "sameAs": [
            "https://github.com/MemoOR",
            "https://www.linkedin.com/in/guillermo-or"
        ],
        "knowsAbout": ["AWS", "Azure", "GCP", "OCI", "Python", "Terraform", "Bicep", "CloudFormation", "DevOps", "Full Stack Development"],
        "alumniOf": {
            "@type": "CollegeOrUniversity",
            "name": "Universidad Iberoamericana"
        }
    }
    </script>

    <title>{% block title %}{% endblock %}</title>
</head>

<body class="appear-animate">
    {% block content %}{% endblock %}
    {% include "includes/scripts.html" %}
</body>

</html>
